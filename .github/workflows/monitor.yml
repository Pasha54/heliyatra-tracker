name: HeliYatra 6-Hour Cron Watcher

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-heliyatra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi

      - name: Run HeliYatra Monitor
        run: |
          python -c "import curl_cffi; print('curl_cffi loaded successfully!')"
          if [ -f ".github/workflows/monitory.py" ]; then
            python .github/workflows/monitory.py
          elif [ -f ".github/workflows/monitor.py" ]; then
            python .github/workflows/monitor.py
          else
            python monitor.py
          fi
