name: HeliYatra 1-Hour Cron Watcher

on:
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:

jobs:
  check-heliyatra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run HeliYatra Monitor
        env:
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_RECIPIENT: ${{ secrets.WA_RECIPIENT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'heliyatra_postmonsoon_alert_2026' }}
        run: |
          if [ -f ".github/workflows/monitory.py" ]; then
            python .github/workflows/monitory.py
          elif [ -f ".github/workflows/monitor.py" ]; then
            python .github/workflows/monitor.py
          else
            python monitor.py
          fi
